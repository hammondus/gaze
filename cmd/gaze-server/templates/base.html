<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · gaze</title>
<link rel="stylesheet" href="/static/style.css?v={{.Asset}}">
</head>
<body>
<header>
  <a class="brand" href="/">gaze</a>
  {{if .Authed}}
  <nav>
    <a href="/hosts/enroll">enrol a host</a>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <button class="linkish">sign out</button>
    </form>
  </nav>
  {{end}}
</header>
<main>
{{if .Error}}<p class="flash">{{.Error}}</p>{{end}}
{{block "content" .}}{{end}}
</main>
</body>
</html>
