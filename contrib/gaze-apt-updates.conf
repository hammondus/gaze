// gaze-agent: recount pending upgrades whenever the answer can change.
// Install as /etc/apt/apt.conf.d/90gaze-apt-updates.conf; see the header
// of gaze-apt-updates for the rest.
//
// Update::Post-Invoke-Success runs after every successful package-list
// refresh, including the daily apt timer. DPkg::Post-Invoke runs after
// every install or removal, so the count drops as soon as you upgrade.
// "|| true" keeps a missing script from failing apt.
APT::Update::Post-Invoke-Success { "[ -x /usr/local/sbin/gaze-apt-updates ] && /usr/local/sbin/gaze-apt-updates || true"; };
DPkg::Post-Invoke { "[ -x /usr/local/sbin/gaze-apt-updates ] && /usr/local/sbin/gaze-apt-updates || true"; };
